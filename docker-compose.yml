services:
  # 1. The Database Engine
  db:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Database visual manager
  pgadmin:
    image: dpage/pgadmin4
    container_name: ecommerce_pgadmin
    platform: linux/amd64
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tradehub.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8080:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db

  # 3. Node.js API Backend
  backend:
    build: ./backend
    container_name: ecommerce_backend
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      - ./test_data:/app/test_data
      - /app/node_modules
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-ecommerce_db}
      JWT_SECRET: ${JWT_SECRET}
      NGROK_URL: ${NGROK_URL:-}
    depends_on:
      - db

  # 4. React Frontend User Interface
  frontend:
    build: ./frontend
    container_name: ecommerce_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_NGROK_HOST: ${VITE_NGROK_HOST:-}
      VITE_ADMIN_LOGIN_PATH: ${VITE_ADMIN_LOGIN_PATH:-/admin-access-portal}

  # 5. Nginx Reverse Proxy / Router
  nginx:
    build: ./nginx
    container_name: ecommerce_proxy
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
